[package]
name = "cc-proxy"
version = "0.1.0"
description = "Standalone passthrough relay for the Anthropic, OpenAI and Gemini model APIs"
authors = ["Jason Young"]
license = "MIT"
repository = "https://github.com/farion1231/cc-switch"
edition = "2021"
rust-version = "1.85.0"
publish = false

[[bin]]
name = "cc-proxy"
path = "src/main.rs"

[dependencies]
cc-proxy-core = { path = "../cc-proxy-core" }
clap = { version = "~4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
http = "1"
