[package]
name = "cc-proxy-core"
version = "0.1.0"
description = "CC Switch local proxy engine, independent of Tauri and SQLite"
authors = ["Jason Young"]
license = "MIT"
repository = "https://github.com/farion1231/cc-switch"
edition = "2021"
rust-version = "1.85.0"
publish = false

[features]
default = []
# 向下游 crate 暴露测试辅助（生产构建不启用）
test-util = ["cc-switch-domain/test-util"]

[dependencies]
base64 = "0.22"
bytes = "1"
cc-switch-domain = { path = "../cc-switch-domain" }
http = "1"
http-body = "1"
http-body-util = "0.1"
serde_json = "1.0"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy", "client-proxy"] }
percent-encoding = "2.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt", "net", "time", "sync", "io-util"] }
tracing = "0.1"
url = "2.5"
webpki-roots = "0.26"

[dev-dependencies]
httparse = "1.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
